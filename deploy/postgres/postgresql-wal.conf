# PostgreSQL WAL Archiving & Point-in-Time Recovery (PITR) Configuration (PROD-010)
# Achieves RPO < 15 minutes via continuous WAL archiving (archive_timeout = 300s).

wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=product-value-system archive-push %p'
archive_timeout = 300

# WAL retention & replication slots
wal_keep_size = 1GB
max_wal_senders = 3

# Checkpoint smoothing for zero-downtime backup performance
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
