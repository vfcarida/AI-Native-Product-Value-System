# pgBackRest Enterprise Backup & Cross-Region Replication Configuration (PROD-010)
# Encryption passphrases and AWS credentials MUST be injected via Kubernetes Secrets
# environment variables (PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO2_CIPHER_PASS,
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or IRSA) — NEVER hardcoded here.

[global]
# Repository 1: Local fast-restore hot backup storage (7-day retention)
repo1-path=/var/lib/pgbackrest
repo1-retention-full=7
repo1-retention-diff=4
repo1-retention-archive=7
repo1-cipher-type=aes-256-cbc

# Repository 2: Cross-region encrypted S3 archive (us-east-1 -> us-west-2, 30-day retention)
repo2-type=s3
repo2-s3-bucket=pvs-backups
repo2-s3-region=us-west-2
repo2-s3-endpoint=s3.us-west-2.amazonaws.com
repo2-s3-uri-style=host
repo2-s3-verify-tls=y
repo2-retention-full=30
repo2-retention-archive=30
repo2-cipher-type=aes-256-cbc

# Parallelism & observability
process-max=4
start-fast=y
delta=y
log-level-console=info
log-level-file=detail

[product-value-system]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
