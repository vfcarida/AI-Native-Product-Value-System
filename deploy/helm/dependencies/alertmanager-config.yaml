# Prometheus AlertManager Configuration for PagerDuty, Slack & Email (PROD-008)
# Credentials are mounted from Kubernetes Secret `alertmanager-secrets` via `*_file`
# directives — zero plaintext webhook URLs or API keys in ConfigMaps.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: product-value-system
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
      slack_api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        # Critical alerts: Page primary on-call via PagerDuty AND fan out to Slack
        - match:
            severity: critical
          receiver: pagerduty-critical
          continue: true

        - match:
            severity: critical
          receiver: slack-critical

        # Warning alerts: Slack only (no 24/7 page)
        - match:
            severity: warning
          receiver: slack-warnings

        # Informational alerts: Email digest only
        - match:
            severity: info
          receiver: email-info

    inhibit_rules:
      # If entire service is down, suppress downstream alerts for that service
      - source_match:
          alertname: 'ServiceDown'
        target_match_re:
          service: '.+'
        equal: ['service', 'cluster']

      # If host node is down, suppress pod-level alerts on that node
      - source_match:
          alertname: 'NodeDown'
        target_match_re:
          alertname: 'PodCrashLooping|PodMemoryHigh|PodCPUThrottled'
        equal: ['node']

    receivers:
      - name: 'default'

      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key_file: '/etc/alertmanager/secrets/pagerduty_service_key'
            severity: 'critical'
            send_resolved: true
            details:
              alertname: '{{ .GroupLabels.alertname }}'
              summary: '{{ .CommonAnnotations.summary }}'
              description: '{{ .CommonAnnotations.description }}'
              runbook: '{{ .CommonAnnotations.runbook_url }}'
              dashboard: '{{ .CommonAnnotations.dashboard_url }}'
            links:
              - href: '{{ .CommonAnnotations.runbook_url }}'
                text: 'Runbook'
              - href: '{{ .CommonAnnotations.dashboard_url }}'
                text: 'SLO Dashboard'
              - href: '{{ .GeneratorURL }}'
                text: 'Prometheus'

      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            username: 'AlertManager'
            icon_emoji: ':rotating_light:'
            title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
            text: |
              *Summary*: {{ .CommonAnnotations.summary }}
              *Description*: {{ .CommonAnnotations.description }}
              *Runbook*: {{ .CommonAnnotations.runbook_url }}
              *Dashboard*: {{ .CommonAnnotations.dashboard_url }}
              *Affected*: {{ range .Alerts }}{{ .Labels.instance }} {{ end }}
            send_resolved: true

      - name: 'slack-warnings'
        slack_configs:
          - channel: '#alerts-warnings'
            username: 'AlertManager'
            icon_emoji: ':warning:'
            title: ':warning: WARNING: {{ .GroupLabels.alertname }}'
            text: |
              *Summary*: {{ .CommonAnnotations.summary }}
              *Description*: {{ .CommonAnnotations.description }}
              *Runbook*: {{ .CommonAnnotations.runbook_url }}
            send_resolved: true

      - name: 'email-info'
        email_configs:
          - to: 'engineering-notifications@example.com'
            from: 'alertmanager@product-value-system.internal'
            smarthost: 'smtp.sendgrid.net:587'
            auth_username: 'apikey'
            auth_password_file: '/etc/alertmanager/secrets/sendgrid_api_key'
            headers:
              Subject: '[INFO] {{ .GroupLabels.alertname }}'
            html: |
              <h2>{{ .CommonAnnotations.summary }}</h2>
              <p>{{ .CommonAnnotations.description }}</p>
              <p><a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a></p>
