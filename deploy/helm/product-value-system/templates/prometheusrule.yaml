{{- if .Values.slo.enabled }}
{{- $ns := default .Release.Namespace .Values.slo.namespace -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pvs.fullname" . }}-alerts
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    {{- with .Values.slo.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: slo_recording_rules
      interval: 30s
      rules:
        - record: pvs:slo_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{code=~"2..",namespace="{{ $ns }}"}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
        - record: pvs:slo_latency_p99:seconds5m
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="{{ $ns }}"}[5m])) by (le)
            )
        - record: pvs:slo_error_rate:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{code=~"5..",namespace="{{ $ns }}"}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
        - record: pvs:slo_agent_success:ratio_rate10m
          expr: |
            sum(rate(agent_runs_total{status="completed",namespace="{{ $ns }}"}[10m]))
            /
            clamp_min(sum(rate(agent_runs_total{namespace="{{ $ns }}"}[10m])), 1e-9)

    - name: slo_availability
      interval: 30s
      rules:
        - alert: SLOAvailabilityBudgetBurn
          expr: |
            (
              1 - (
                sum(rate(http_requests_total{code=~"2..",namespace="{{ $ns }}"}[5m]))
                /
                clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
              )
            ) > {{ .Values.slo.availability.errorBudget }}
          for: 5m
          labels:
            severity: warning
            slo: availability
            tier: control-plane
          annotations:
            summary: "SLO-01 availability error budget burning"
            description: "Current non-2xx ratio {{ "{{ $value | humanizePercentage }}" }} exceeds 28d error budget threshold ({{ .Values.slo.availability.errorBudget }})."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#sloburnrateslow"

        - alert: SLOAvailabilityCritical
          expr: |
            (
              1 - (
                sum(rate(http_requests_total{code=~"2..",namespace="{{ $ns }}"}[5m]))
                /
                clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
              )
            ) > {{ .Values.slo.availability.criticalErrorRate }}
          for: 2m
          labels:
            severity: critical
            slo: availability
            tier: control-plane
          annotations:
            summary: "SLO-01 availability critical breach (10x error budget)"
            description: "Non-2xx ratio {{ "{{ $value | humanizePercentage }}" }} is >10x the 0.1% availability error budget."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#sloburnratefast"

        - alert: SLOAvailabilityMultiWindowBurn
          expr: |
            (
              (
                1 - (
                  sum(rate(pvs_requests_total{status="success",namespace="{{ $ns }}"}[1h]))
                  /
                  clamp_min(sum(rate(pvs_requests_total{namespace="{{ $ns }}"}[1h])), 1e-9)
                )
              ) > (14.4 * {{ .Values.slo.availability.errorBudget }})
            )
            and
            (
              (
                1 - (
                  sum(rate(pvs_requests_total{status="success",namespace="{{ $ns }}"}[5m]))
                  /
                  clamp_min(sum(rate(pvs_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
                )
              ) > (14.4 * {{ .Values.slo.availability.errorBudget }})
            )
          for: 2m
          labels:
            severity: critical
            slo: availability
            tier: control-plane
          annotations:
            summary: "SLO-01 fast multi-window burn rate (14.4x)"
            description: "Both 5m and 1h burn rates exceed 14.4x budget; 28-day error budget will exhaust in <2 days."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#sloburnratefast"

    - name: slo_latency
      interval: 30s
      rules:
        - alert: SLOLatencyP99High
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="{{ $ns }}"}[5m])) by (le)
            ) > {{ .Values.slo.latency.p99TargetSeconds }}
          for: 5m
          labels:
            severity: warning
            slo: latency
            tier: control-plane
          annotations:
            summary: "SLO-02 API p99 latency degraded"
            description: "HTTP p99 latency {{ "{{ $value | humanizeDuration }}" }} exceeds {{ .Values.slo.latency.p99TargetSeconds }}s SLO target."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#latencysloburnslow"

        - alert: SLOLatencyP99Critical
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="{{ $ns }}"}[5m])) by (le)
            ) > {{ .Values.slo.latency.p99CriticalSeconds }}
          for: 2m
          labels:
            severity: critical
            slo: latency
            tier: control-plane
          annotations:
            summary: "SLO-02 API p99 latency critical breach"
            description: "HTTP p99 latency {{ "{{ $value | humanizeDuration }}" }} exceeds {{ .Values.slo.latency.p99CriticalSeconds }}s severe threshold."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#latencysloburnfast"

        - alert: SLOLatencyP95Sustained
          expr: |
            avg_over_time(pvs_latency_p95_seconds{namespace="{{ $ns }}"}[15m]) > {{ .Values.slo.latency.p95SustainedSeconds }}
          for: 10m
          labels:
            severity: warning
            slo: latency
            tier: control-plane
          annotations:
            summary: "Agent/model p95 latency sustained above target"
            description: "15m average pvs_latency_p95_seconds ({{ "{{ $value | humanizeDuration }}" }}) exceeds {{ .Values.slo.latency.p95SustainedSeconds }}s."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#latencysloburnslow"

    - name: slo_error_rate
      interval: 30s
      rules:
        - alert: SLOErrorRateHigh
          expr: |
            (
              sum(rate(http_requests_total{code=~"5..",namespace="{{ $ns }}"}[5m]))
              /
              clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
            ) > {{ .Values.slo.errorRate.threshold }}
          for: 5m
          labels:
            severity: warning
            slo: error_rate
            tier: control-plane
          annotations:
            summary: "SLO-03 HTTP 5xx error rate elevated"
            description: "5xx error rate {{ "{{ $value | humanizePercentage }}" }} exceeds {{ .Values.slo.errorRate.threshold }} threshold."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#sloburnrateslow"

        - alert: SLOErrorRateCritical
          expr: |
            (
              sum(rate(http_requests_total{code=~"5..",namespace="{{ $ns }}"}[5m]))
              /
              clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9)
            ) > {{ .Values.slo.errorRate.criticalThreshold }}
          for: 2m
          labels:
            severity: critical
            slo: error_rate
            tier: control-plane
          annotations:
            summary: "SLO-03 HTTP 5xx error rate critical"
            description: "5xx error rate {{ "{{ $value | humanizePercentage }}" }} exceeds {{ .Values.slo.errorRate.criticalThreshold }} critical limit."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#sloburnratefast"

    - name: slo_agent_success
      interval: 60s
      rules:
        - alert: AgentSuccessRateLow
          expr: |
            (
              sum(rate(agent_runs_total{status="completed",namespace="{{ $ns }}"}[10m]))
              /
              clamp_min(sum(rate(agent_runs_total{namespace="{{ $ns }}"}[10m])), 1e-9)
            ) < {{ .Values.slo.agentSuccess.target }}
          for: 10m
          labels:
            severity: warning
            slo: agent_success
            tier: agent-plane
          annotations:
            summary: "SLO-04 agent completion rate below 95% target"
            description: "Agent completion rate {{ "{{ $value | humanizePercentage }}" }} dropped below {{ .Values.slo.agentSuccess.target }} SLO."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#qualitydegradationwarning"

        - alert: AgentSuccessRateCritical
          expr: |
            (
              sum(rate(agent_runs_total{status="completed",namespace="{{ $ns }}"}[10m]))
              /
              clamp_min(sum(rate(agent_runs_total{namespace="{{ $ns }}"}[10m])), 1e-9)
            ) < {{ .Values.slo.agentSuccess.criticalThreshold }}
          for: 5m
          labels:
            severity: critical
            slo: agent_success
            tier: agent-plane
          annotations:
            summary: "SLO-04 agent completion rate critically low"
            description: "Agent completion rate {{ "{{ $value | humanizePercentage }}" }} dropped below {{ .Values.slo.agentSuccess.criticalThreshold }}; freeze deployments."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/runbooks/alerting.md#qualitydegradationcritical"

    - name: resource_saturation
      interval: 30s
      rules:
        - alert: PodMemoryHigh
          expr: |
            (
              container_memory_usage_bytes{namespace="{{ $ns }}",container!=""}
              /
              clamp_min(container_spec_memory_limit_bytes{namespace="{{ $ns }}",container!=""}, 1)
            ) > {{ .Values.slo.saturation.memoryThreshold }}
          for: 5m
          labels:
            severity: warning
            slo: saturation
            tier: infrastructure
          annotations:
            summary: "Pod memory usage exceeds saturation threshold"
            description: "Pod {{ "{{ $labels.pod }}" }} memory utilization at {{ "{{ $value | humanizePercentage }}" }}."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/operations/slos.md#alerting-rules"

        - alert: PodCPUThrottled
          expr: |
            rate(container_cpu_cfs_throttled_seconds_total{namespace="{{ $ns }}",container!=""}[5m])
            > {{ .Values.slo.saturation.cpuThrottleThreshold }}
          for: 5m
          labels:
            severity: warning
            slo: saturation
            tier: infrastructure
          annotations:
            summary: "Pod CPU throttling detected"
            description: "Pod {{ "{{ $labels.pod }}" }} CPU throttled {{ "{{ $value | humanizePercentage }}" }} of interval."
            runbook_url: "https://github.com/vfcarida/AI-Native-Product-Value-System/blob/main/docs/operations/slos.md#alerting-rules"
{{- end }}
