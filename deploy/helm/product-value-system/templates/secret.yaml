{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pvs.secretName" . }}
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiApiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.pvsMetricsApiKey }}
  PVS_METRICS_API_KEY: {{ .Values.secrets.pvsMetricsApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.pvsAdminApiKey }}
  PVS_ADMIN_API_KEY: {{ .Values.secrets.pvsAdminApiKey | quote }}
  {{- end }}
{{- end }}
