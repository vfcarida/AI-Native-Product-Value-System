{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pvs.fullname" . }}-pgbouncer-config
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    pvs_db = host={{ include "pvs.fullname" . }}-postgres-primary port=5432 dbname=pvs_db

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/secrets/userlist.txt

    pool_mode = {{ .Values.pgbouncer.poolMode }}
    max_client_conn = {{ .Values.pgbouncer.maxClientConnections }}
    default_pool_size = {{ .Values.pgbouncer.defaultPoolSize }}
    reserve_pool_size = {{ .Values.pgbouncer.reservePoolSize }}
    reserve_pool_timeout = 3

    server_idle_timeout = 600
    server_connect_timeout = 15
    query_timeout = 60

    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pvs.fullname" . }}-pgbouncer
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      app: pgbouncer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: pgbouncer
        {{- include "pvs.labels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      serviceAccountName: {{ include "pvs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: secrets
              mountPath: /etc/pgbouncer/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "pvs.fullname" . }}-pgbouncer-config
        - name: secrets
          secret:
            secretName: {{ .Values.pgbouncer.existingSecret }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pvs.fullname" . }}-pgbouncer
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  type: ClusterIP
  selector:
    app: pgbouncer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
{{- end }}
