{{- if and .Values.alerting.enabled .Values.alerting.createSecret (not .Values.alerting.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pvs.fullname" . }}-alertmanager-secrets
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
type: Opaque
stringData:
  {{- if .Values.alerting.pagerduty.serviceKey }}
  pagerduty_service_key: {{ .Values.alerting.pagerduty.serviceKey | quote }}
  {{- end }}
  {{- if .Values.alerting.slack.webhookUrl }}
  slack_webhook_url: {{ .Values.alerting.slack.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.alerting.sendgrid.apiKey }}
  sendgrid_api_key: {{ .Values.alerting.sendgrid.apiKey | quote }}
  {{- end }}
{{- end }}
