{{- if and .Values.vault.enabled .Values.vault.createDedicatedServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pvs.fullname" . }}-vault-auth
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-auth
  {{- with .Values.vault.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
