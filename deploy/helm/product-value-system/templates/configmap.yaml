apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pvs.fullname" . }}-config
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  SANDBOX_PROVIDER: {{ .Values.config.sandboxProvider | quote }}
  PVS_DEVX_AGGREGATE_ONLY: {{ .Values.config.devxAggregateOnly | quote }}
  PVS_DEVX_ANONYMIZE: {{ .Values.config.devxAnonymize | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: {{ .Values.config.otelCaptureMessageContent | quote }}
  {{- if .Values.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  {{- else if .Values.otelCollector.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s-otel-collector:4318" (include "pvs.fullname" .) | quote }}
  {{- end }}
  PVS_CACHE_BACKEND: {{ .Values.config.cacheBackend | quote }}
  {{- if .Values.config.redisHost }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  {{- end }}
  {{- if .Values.config.redisUrl }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  {{- end }}
  {{- if .Values.config.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ .Values.config.ollamaBaseUrl | quote }}
  {{- end }}
  {{- if .Values.config.azureOpenaiEndpoint }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.config.azureOpenaiEndpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.config.azureOpenaiDeployment | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.config.azureOpenaiApiVersion | quote }}
  {{- end }}
  PVS_ENABLE_CONTROL_PLANE: {{ .Values.config.enableControlPlane | default "true" | quote }}
  PVS_ENABLE_PROTOCOLS: {{ .Values.config.enableProtocols | default "true" | quote }}
  PVS_ENABLE_INTEGRATIONS: {{ .Values.config.enableIntegrations | default "true" | quote }}
  PVS_ENABLE_WORKER: {{ .Values.config.enableWorker | default "true" | quote }}
  PVS_WORKER_EXECUTOR: {{ .Values.config.workerExecutor | default "mock" | quote }}
  PVS_ENABLE_DEVX: {{ .Values.config.enableDevx | default "true" | quote }}
  PVS_ENABLE_AUDIT: {{ .Values.config.enableAudit | default "true" | quote }}
  PVS_ALLOW_ANONYMOUS_DEV: {{ .Values.config.allowAnonymousDev | default "false" | quote }}
  PVS_RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | default "120" | quote }}
  {{- if .Values.config.jwtIssuer }}
  PVS_JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  {{- end }}
  {{- if .Values.config.jwtAudience }}
  PVS_JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
  {{- end }}
  {{- if .Values.config.jwksUrl }}
  PVS_JWKS_URL: {{ .Values.config.jwksUrl | quote }}
  {{- end }}
