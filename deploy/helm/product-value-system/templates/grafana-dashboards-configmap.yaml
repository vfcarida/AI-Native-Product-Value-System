{{- if .Values.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pvs.fullname" . }}-grafana-dashboards
  labels:
    {{- include "pvs.labels" . | nindent 4 }}
    {{ .Values.grafanaDashboards.label }}: {{ .Values.grafanaDashboards.labelValue | quote }}
data:
  pvs-overview.json: |
    {
      "title": "AI-Native Product Value System — SLO, FinOps & DevX",
      "uid": "pvs-control-plane-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "SPACE Overall Score (Aggregate Only)",
          "targets": [{"expr": "devx_space_score{dimension=\"overall\"}"}]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Value Stream Stage Latency (p95)",
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(devx_cycle_time_seconds_bucket[5m])) by (le, stage))"}]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "LLM Token Usage Rate",
          "targets": [{"expr": "sum(rate(gen_ai_client_token_usage_sum[5m])) by (gen_ai_system)"}]
        }
      ]
    }
  pvs-slo-dashboard.json: |
    {
      "title": "Product Value System - SLO Dashboard",
      "uid": "pvs-slo-dashboard",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "SLO-01 Availability (28d)",
          "targets": [{"expr": "sum(rate(http_requests_total{code=~\"2..\"}[28d])) / clamp_min(sum(rate(http_requests_total[28d])), 1e-9)"}]
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "SLO-01 Error Budget Remaining (28d)",
          "targets": [{"expr": "(0.001 - (1 - sum(rate(http_requests_total{code=~\"2..\"}[28d])) / clamp_min(sum(rate(http_requests_total[28d])), 1e-9))) / 0.001 * 100"}]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "SLO-02 API Latency p99 (5m)",
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))"}]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "SLO-03 API 5xx Error Rate (5m)",
          "targets": [{"expr": "sum(rate(http_requests_total{code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)"}]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "SLO-04 Agent Completion Rate (28d)",
          "targets": [{"expr": "sum(rate(agent_runs_total{status=\"completed\"}[28d])) / clamp_min(sum(rate(agent_runs_total[28d])), 1e-9)"}]
        }
      ]
    }
  pvs-alert-metrics.json: |
    {
      "title": "Product Value System - Alerting & On-Call Metrics",
      "uid": "pvs-alert-metrics",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Alerts Firing (by Severity)",
          "targets": [{"expr": "sum by (severity) (ALERTS{alertstate=\"firing\"})"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "False Positive / Silenced Rate (%)",
          "targets": [{"expr": "(sum(rate(alertmanager_silences_active[24h])) / clamp_min(sum(rate(alertmanager_alerts_received_total[24h])), 1e-9)) * 100"}]
        }
      ]
    }
{{- end }}
