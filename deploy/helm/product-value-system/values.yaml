# Default production-hardened values for product-value-system.
# Override per environment using `helm upgrade --install -f values-prod.yaml`.

replicaCount: 3

image:
  repository: ghcr.io/vfcarida/product-value-system
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Non-root hardened Pod security context matching Dockerfile UID/GID 10001
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Hardened container security context (OWASP / Kubernetes Restricted PSS)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

# Runs the production ASGI composition root with lifespan-managed DB, Audit, DevX & Control Plane
command:
  - uvicorn
args:
  - product_value_system.api.app_factory:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"

service:
  type: ClusterIP
  port: 8000
  targetPort: http
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pvs.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Health & telemetry probes aligned with product_value_system.api.health
probes:
  startup:
    path: /health/startup
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 3

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  targetRequestsPerSecond: null # Set e.g. "1000" when custom metrics adapter is installed

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  unhealthyPodEvictionPolicy: IfHealthyBudget

# High Availability Application, PostgreSQL Patroni & PgBouncer (PROD-011)
ha:
  enabled: true
  antiAffinity:
    enabled: true

postgresql:
  ha:
    enabled: false # Enable when etcd + fast-ssd storageClass are provisioned
    replicas: 3 # 1 primary + 2 streaming standbys
    existingSecret: "postgres-ha-secrets"
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    patroni:
      etcdHosts: "etcd:2379"
    failover:
      maxLagMb: 1
      timeoutSeconds: 30
    storage:
      size: 100Gi
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi

pgbouncer:
  enabled: false # Enable alongside postgresql.ha for transaction-level pooling
  replicas: 2
  existingSecret: "pgbouncer-secrets"
  poolMode: transaction
  maxClientConnections: 1000
  defaultPoolSize: 20
  reservePoolSize: 5
  image:
    repository: edoburu/pgbouncer
    tag: "v1.23.1-p0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Non-sensitive runtime configuration rendered into ConfigMap
config:
  logLevel: INFO
  logFormat: json
  sandboxProvider: docker
  devxAggregateOnly: "true"
  devxAnonymize: "true"
  otelServiceName: product-value-system
  otelCaptureMessageContent: "false"
  otelExporterOtlpEndpoint: ""
  cacheBackend: redis
  redisHost: ""
  redisPort: "6379"
  redisUrl: ""
  ollamaBaseUrl: ""
  azureOpenaiEndpoint: ""
  azureOpenaiDeployment: ""
  azureOpenaiApiVersion: "2024-10-21"
  enableControlPlane: "true"
  enableProtocols: "true"
  enableIntegrations: "true"
  enableDevx: "true"
  enableAudit: "true"
  allowAnonymousDev: "false"
  rateLimitPerMinute: "120"
  jwtIssuer: ""
  jwtAudience: ""

# Secret management: ALWAYS prefer `existingSecret` (External Secrets / Vault / SealedSecrets)
secrets:
  existingSecret: ""
  create: false
  # Only used when `secrets.create=true` and `secrets.existingSecret` is empty; pass via --set
  databaseUrl: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  azureOpenaiApiKey: ""
  pvsMetricsApiKey: ""
  pvsAdminApiKey: ""
  pvsJwtSecret: ""
  pvsAuditSigningKey: ""
  pvsGithubWebhookSecret: ""
  pvsSlackSigningSecret: ""

# Zero-trust default-deny egress NetworkPolicy
networkPolicy:
  enabled: true
  allowDns: true
  allowHttpsEgress: true
  allowedEgressCidrs: []
  allowRedisPort: 6379
  allowOtlpGrpcPort: 4317
  allowOtlpHttpPort: 4318
  ingressNamespaceSelector: {}

# Prometheus Operator ServiceMonitor scraping `/metrics`
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}

# Prometheus Operator SLO Alerting & Recording Rules (`PrometheusRule` CRD — PROD-002)
slo:
  enabled: false
  window: 28d
  namespace: "" # Defaults to .Release.Namespace when empty
  labels: {}
  availability:
    target: 0.999
    errorBudget: 0.001 # 0.1% (~40.32 min / 28d)
    criticalErrorRate: 0.01 # 10x error budget burn
  latency:
    p99TargetSeconds: 1.0
    p99CriticalSeconds: 5.0
    p95SustainedSeconds: 5.0
    errorBudget: 0.01 # 1% (~403.2 min / 28d)
  errorRate:
    threshold: 0.01 # < 1% 5xx requests
    criticalThreshold: 0.05
    errorBudget: 0.005 # 0.5%
  agentSuccess:
    target: 0.95 # > 95% completed agent runs
    criticalThreshold: 0.85
    errorBudget: 0.02 # 2%
  saturation:
    memoryThreshold: 0.9
    cpuThrottleThreshold: 0.5

# Optional companion OpenTelemetry Collector (OTLP gRPC 4317 / HTTP 4318 -> Prometheus 8889 / Jaeger)
otelCollector:
  enabled: false
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.114.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

# Distributed Tracing with Jaeger & Adaptive/Probabilistic Sampling (PROD-007)
tracing:
  enabled: false
  sampleRate: 0.1 # 10% sampling in production (set 1.0 in development)
  jaeger:
    enabled: true
    deployInstance: false # Set true when Jaeger Operator CRD is installed
    strategy: production # production | allInOne
    collectorEndpoint: "product-value-system-jaeger-collector.jaeger.svc.cluster.local:4317"
    insecure: false
    collectorReplicas: 3
    queryReplicas: 2
    retentionTtlSeconds: 2592000 # 30 days hot storage
    cassandra:
      servers: "cassandra.jaeger.svc.cluster.local"
      keyspace: "jaeger_v1_prod"
      replicationFactor: 3

# Optional Grafana sidecar dashboard ConfigMap (`grafana_dashboard: "1"`)
grafanaDashboards:
  enabled: false
  label: grafana_dashboard
  labelValue: "1"

# HashiCorp Vault enterprise secrets integration & Agent Injector sidecar (PROD-004)
vault:
  enabled: false
  address: "https://vault.vault.svc.cluster.local:8200"
  authMethod: "kubernetes"
  role: "product-value-system"
  namespace: ""
  agentInject: true
  secretPath: "secret/data/product-value-system"
  injectSecrets:
    - openai
    - anthropic
    - database
  createDedicatedServiceAccount: false
  serviceAccountAnnotations: {}

# Compliance Audit Trail, S3 Glacier Archival & Retention CronJobs (PROD-006)
compliance:
  enabled: false
  retention:
    hotStorageDays: 90
    coldStorageDays: 2555
    archivalSchedule: "0 2 * * *"
    deletionSchedule: "0 3 1 * *"
  s3:
    bucket: "pvs-audit-archive"
    region: "us-east-1"
    storageClass: "GLACIER"
    encryption: "AES256"
  cronjob:
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# AlertManager On-Call Automation — PagerDuty, Slack & Email (PROD-008)
alerting:
  enabled: false
  existingSecret: "" # Preferred: Vault / External Secrets managed Secret
  createSecret: false
  pagerduty:
    serviceKey: "" # Pass via --set or existingSecret
    escalationDelayMinutes: 15
  slack:
    webhookUrl: "" # Pass via --set or existingSecret
    criticalChannel: "#alerts-critical"
    warningChannel: "#alerts-warnings"
  sendgrid:
    apiKey: "" # Pass via --set or existingSecret
    toEmail: "engineering-notifications@example.com"

# Isolated k6 Load Testing Environment Parameters (PROD-009)
loadTesting:
  enabled: false
  isolatedNamespace: "pvs-load-test"
  replicaCount: 3
  maxMonthlySpendUsd: 100
  seed: 42
  k6Resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Disaster Recovery — Hourly pgBackRest Backups, Cross-Region S3 & Verification (PROD-010)
disasterRecovery:
  enabled: false
  stanza: "product-value-system"
  backupSchedule: "0 * * * *" # Hourly (full on Sunday, diff Mon-Sat)
  verificationSchedule: "0 6 * * 0" # Weekly Sunday 06:00 UTC restore test
  existingSecret: "backup-secrets"
  pvcName: "backup-storage-pvc"
  rtoTargetSeconds: 3600 # < 1 hour
  rpoTargetSeconds: 900 # < 15 minutes
  s3:
    bucket: "pvs-backups"
    primaryRegion: "us-east-1"
    replicaRegion: "us-west-2"
    retentionDays: 30
    objectLockEnabled: true
  pgbackrestImage:
    repository: pgbackrest/pgbackrest
    tag: "2.53.1"
    pullPolicy: IfNotPresent
  postgresImage:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
