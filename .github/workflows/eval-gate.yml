name: Evaluation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent dataset to evaluate (or 'all')"
        required: false
        default: "all"
      fast:
        description: "Run fast subset evaluation"
        required: false
        type: boolean
        default: true

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Validate golden dataset schemas & secret hygiene
        run: |
          python scripts/curate_golden_dataset.py --validate-all

      - name: Run golden dataset unit & regression tests
        run: |
          pytest tests/eval/test_golden_dataset_regression.py -v

      - name: Run fast eval (PR check)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          pvs eval "${{ inputs.agent || 'all' }}" \
            --fast \
            --subset-size 10 \
            --threshold 0.75 \
            --max-cost 10.0 \
            --output-json eval_reports

      - name: Run full eval (main merge)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && !inputs.fast)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          pvs eval "${{ inputs.agent || 'all' }}" \
            --threshold 0.75 \
            --max-cost 20.0 \
            --baseline-dir .eval_baselines \
            --output-json eval_reports

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval_reports/eval_results_*.json
            .eval_baselines/*_baseline.json
          if-no-files-found: ignore

      - name: Comment PR on evaluation gate failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ **Evaluation gate failed.** Inspect the uploaded `eval-results` artifact and review failed golden dataset samples before merging."
            });
