[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-value-system"
version = "2.5.1"
description = "AI-native Product Value System reference implementation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "AI-native Product Value System Contributors"}
]
keywords = ["ai", "agents", "product", "development", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "docker>=7.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "networkx>=3.1",
]

[project.urls]
Documentation = "https://github.com/vfcarida/AI-Native-Product-Value-System/tree/main/docs"
Repository = "https://github.com/vfcarida/AI-Native-Product-Value-System"
Issues = "https://github.com/vfcarida/AI-Native-Product-Value-System/issues"

[project.optional-dependencies]
simulation = [
    "tinytroupe>=0.2.0",
    "scipy>=1.11",
]
eval = [
    "scipy>=1.11",
    "jsonschema>=4.0",
    "inquirer>=3.1.0",
    "aiofiles>=23.2.0",
]
monitoring = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "opentelemetry-exporter-prometheus>=0.46b0",
]
experiments = [
    "scipy>=1.11",
    "numpy>=1.26",
]
validation = [
    "scipy>=1.11",
    "numpy>=1.26",
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
discovery = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
]
evidence = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
]
security-ml = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0",
]
caching = [
    "xxhash>=3.4.0",
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
]
routing = [
    "tiktoken>=0.5.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]
sandbox = [
    "pyroute2>=0.7.0; sys_platform == 'linux'",
]
brownfield = [
    "GitPython>=3.1.40",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
]
devx = [
    "prometheus-client>=0.20",
]
cedar = [
    "cedarpy>=3.0",
]
postgres = [
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
vault = [
    "hvac>=1.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "hypothesis>=6.100",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "product-value-system[eval,monitoring,experiments,observability,discovery,evidence,caching,routing,brownfield,devx]",
]

[project.scripts]
pvs = "product_value_system.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["docker", "alembic"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "src/product_value_system/policy/,src/product_value_system/security/,src/product_value_system/compliance/"
tests_dir = "tests/security/ tests/compliance/"
runner = "pytest -q -m 'not integration_real'"
