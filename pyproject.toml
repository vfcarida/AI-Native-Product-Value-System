[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-value-system"
version = "0.1.0"
description = "AI-native Product Value System reference implementation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "AI-native Product Value System Contributors"}
]
keywords = ["ai", "agents", "product", "development", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "docker>=7.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
simulation = [
    "tinytroupe>=0.2.0",
    "scipy>=1.11",
]
eval = [
    "scipy>=1.11",
    "jsonschema>=4.0",
    "inquirer>=3.1.0",
    "aiofiles>=23.2.0",
]
monitoring = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "opentelemetry-exporter-prometheus>=0.46b0",
]
experiments = [
    "scipy>=1.11",
    "numpy>=1.26",
]
validation = [
    "scipy>=1.11",
    "numpy>=1.26",
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
discovery = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
]
evidence = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
]
security-ml = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0",
]
caching = [
    "xxhash>=3.4.0",
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
]
routing = [
    "tiktoken>=0.5.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
pvs = "product_value_system.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["docker"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_imports = "skip"
ignore_missing_imports = true
