<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PVS Feature Flags — Progressive Delivery Admin</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    h1 { color: #f8fafc; margin-bottom: 0.25rem; }
    .subtitle { color: #94a3b8; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-on { background: #14532d; color: #86efac; }
    .badge-off { background: #7f1d1d; color: #fca5a5; }
    .badge-stage { background: #1e3a8a; color: #93c5fd; }
    .badge-type { background: #334155; color: #cbd5e1; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { background: #2563eb; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <h1>Feature Flags &amp; Progressive Delivery</h1>
  <p class="subtitle">AI-Native Product Value System (EVO-015) — Manage dark launches, canary rollouts, and kill switches.</p>
  <table>
    <thead>
      <tr>
        <th>Flag</th>
        <th>Type</th>
        <th>Status</th>
        <th>Stage</th>
        <th>Rollout %</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {{ROWS}}
    </tbody>
  </table>
  <script>
    async function toggleFlag(name) {
      const res = await fetch(`/admin/flags/${encodeURIComponent(name)}/toggle`, { method: "POST" });
      if (res.ok) { window.location.reload(); } else { alert("Toggle failed: " + res.status); }
    }
    async function advanceFlag(name) {
      const res = await fetch(`/admin/flags/${encodeURIComponent(name)}/advance`, { method: "POST" });
      if (res.ok) { window.location.reload(); } else { alert("Advance failed: " + res.status); }
    }
  </script>
</body>
</html>
