global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: product-value-system
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "pvs-app"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["pvs-app:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
