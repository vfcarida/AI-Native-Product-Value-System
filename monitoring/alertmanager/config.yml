global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.internal:587"
  smtp_from: "pvs-alerts@example.internal"
  smtp_require_tls: true

route:
  receiver: "slack-warnings"
  group_by: ["slo", "alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "pagerduty-and-slack-critical"
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: "slack-and-email-warnings"

inhibit_rules:
  # Suppress warning alerts for the same SLO while a critical alert is firing
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["slo"]

receivers:
  - name: "pagerduty-and-slack-critical"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: "critical"
        description: "{{ .CommonAnnotations.summary }}"
    slack_configs:
      - api_url: "${SLACK_CRITICAL_WEBHOOK_URL}"
        channel: "#pvs-critical"
        send_resolved: true
        title: "[CRITICAL] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook_url }}"

  - name: "slack-and-email-warnings"
    slack_configs:
      - api_url: "${SLACK_WARNINGS_WEBHOOK_URL}"
        channel: "#pvs-alerts"
        send_resolved: true
        title: "[WARNING] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook_url }}"
    email_configs:
      - to: "pvs-oncall@example.internal"
        send_resolved: true

  - name: "slack-warnings"
    slack_configs:
      - api_url: "${SLACK_WARNINGS_WEBHOOK_URL}"
        channel: "#pvs-alerts"
        send_resolved: true
