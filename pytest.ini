[pytest]
testpaths = tests
addopts = --import-mode=importlib --strict-markers -v
asyncio_mode = auto
log_level = INFO
# Pytest test tier and category markers (documented in tests/README.md)
markers =
    unit: Unit tests (fast, isolated, deterministic, $0)
    integration: Integration tests with mocked or lightweight dependencies ($0)
    integration_real: Real integration tests using live LLM APIs, Docker, and Cedar CLI
    policy_validation: Cedar policy vs. Python fallback synchronization tests
    eval: Evaluation framework and golden dataset quality tests
    security: Adversarial prompt injection, path/command sanitization, and secret detection tests
    slow: Long-running tests excluded from rapid local loops
