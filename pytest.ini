[pytest]
testpaths = tests
addopts = --import-mode=importlib --strict-markers -v
asyncio_mode = auto
log_level = INFO
markers =
    unit: Unit tests (fast, deterministic)
    integration: Integration tests (mocked or lightweight dependencies)
    integration_real: Real integration tests (live LLM APIs, Docker, Cedar CLI)
    policy_validation: Cedar policy vs. Python fallback synchronization tests
    eval: Evaluation framework tests
    security: Security tests
