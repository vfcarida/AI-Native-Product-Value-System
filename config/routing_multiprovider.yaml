# Multi-Provider Complexity-Based LLM Routing Configuration (v1.0)
# Includes OpenAI, Anthropic, Google Gemini, Azure OpenAI, and local Ollama.
routing:
  enabled: true
  shadow_mode: false
  force_tier: null
  preferred_provider: null  # Optional: "openai", "anthropic", "gemini", "azure_openai", or "ollama"

  models:
    low_complexity:
      - provider: ollama
        model: llama3.2
        cost_per_1m_input: 0.0
        cost_per_1m_output: 0.0
      - provider: gemini
        model: gemini-2.5-flash
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60
      - provider: anthropic
        model: claude-3-haiku-20240307
        cost_per_1m_input: 0.25
        cost_per_1m_output: 1.25
      - provider: openai
        model: gpt-4o-mini
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60

    medium_complexity:
      - provider: gemini
        model: gemini-2.5-pro
        cost_per_1m_input: 1.25
        cost_per_1m_output: 10.00
      - provider: azure_openai
        model: gpt-4o
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00
      - provider: anthropic
        model: claude-3-sonnet-20240229
        cost_per_1m_input: 3.00
        cost_per_1m_output: 15.00
      - provider: openai
        model: gpt-4o
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00

    high_complexity:
      - provider: gemini
        model: gemini-2.5-pro
        cost_per_1m_input: 1.25
        cost_per_1m_output: 10.00
      - provider: azure_openai
        model: gpt-4o
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00
      - provider: openai
        model: gpt-4-turbo-2024-04-09
        cost_per_1m_input: 10.00
        cost_per_1m_output: 30.00
      - provider: anthropic
        model: claude-3-opus-20240229
        cost_per_1m_input: 15.00
        cost_per_1m_output: 75.00

  complexity_thresholds:
    low:
      max_input_length: 2000
      max_reasoning_depth: 1
      creativity_required: false
      deterministic: true
    medium:
      max_input_length: 8000
      max_reasoning_depth: 3
      creativity_required: false
      deterministic: false
    high:
      creativity_required: true
      strategic_thinking: true

  quality_check:
    enabled: true
    fallback_on_failure: true
    validation_method: schema_compliance

  cost_tracking:
    enabled: true
    alert_threshold_usd: 100.0
