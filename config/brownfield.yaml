# Brownfield Codebase Analysis, Git History & Strangler Fig Configuration (EVO-030, EVO-031)
# Implements "Your Code as a Crime Scene" temporal analysis and Martin Fowler's
# Strangler Fig incremental modernization planning.
# Set enabled: false in either block for instant rollback.

brownfield:
  git_analysis:
    enabled: true

    # Temporal lookback & detection thresholds
    lookback_days: 180            # Analyze last 6 months of commit history
    min_commits_for_hotspot: 10   # Files with fewer commits are excluded from hotspots
    coupling_threshold: 0.5       # Report file pairs with coupling coefficient >= 0.5
    min_co_changes: 2             # Minimum shared commits required for temporal coupling
    max_files_per_commit: 50      # Ignore bulk reformat commits touching >50 files
    silo_threshold_pct: 80.0      # Flag ownership knowledge silo when primary author >= 80%

    # Privacy: hash author emails deterministically so PII never appears in reports
    anonymize_authors: true

    # File filters
    include_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.java"
      - "*.go"
    exclude_patterns:
      - "node_modules/**"
      - "vendor/**"
      - "*.test.py"
      - "*.spec.js"
      - "test_*.py"

    # Performance safeguard for very large repositories
    max_commits_analyzed: 10000

  strangler_fig:
    enabled: true
    top_candidates: 3

    # Module boundary detection
    boundary_detection:
      method: static_analysis     # 'static_analysis', 'dependency_graph', or 'ml'
      min_module_size_lines: 500  # Ignore tiny modules
      max_module_size_lines: 10000  # Split oversized modules into bounded partitions

    # Weighted priority criteria (negative coupling weight prefers low-coupling modules)
    priority_factors:
      - hotspot_score: 0.4        # Weight: High churn
      - complexity_score: 0.3     # Weight: High complexity
      - coupling_score: -0.2      # Weight: Prefer low coupling
      - business_value: 0.1       # Weight: Stakeholder input

    # Traffic routing & progressive rollout strategy
    routing:
      strategy: feature_flag      # 'feature_flag', 'reverse_proxy', or 'api_gateway'
      initial_percentage: 1       # Start with 1% traffic to modern implementation
      stages: [1, 5, 25, 50, 100]
      monitoring_duration_per_stage_hours: 24
