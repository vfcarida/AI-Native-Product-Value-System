# Complexity-Based LLM Model Routing Configuration (EVO-026)
routing:
  enabled: true
  shadow_mode: false
  force_tier: null  # Set to "high" for safe rollback
  preferred_provider: null  # Optional: "openai" or "anthropic"

  models:
    low_complexity:
      - provider: anthropic
        model: claude-3-haiku-20240307
        cost_per_1m_input: 0.25
        cost_per_1m_output: 1.25
      - provider: openai
        model: gpt-3.5-turbo-0125
        cost_per_1m_input: 0.50
        cost_per_1m_output: 1.50

    medium_complexity:
      - provider: anthropic
        model: claude-3-sonnet-20240229
        cost_per_1m_input: 3.00
        cost_per_1m_output: 15.00
      - provider: openai
        model: gpt-4-0125-preview
        cost_per_1m_input: 10.00
        cost_per_1m_output: 30.00

    high_complexity:
      - provider: openai
        model: gpt-4-turbo-2024-04-09
        cost_per_1m_input: 10.00
        cost_per_1m_output: 30.00
      - provider: anthropic
        model: claude-3-opus-20240229
        cost_per_1m_input: 15.00
        cost_per_1m_output: 75.00

  complexity_thresholds:
    low:
      max_input_length: 2000
      max_reasoning_depth: 1
      creativity_required: false
      deterministic: true
    medium:
      max_input_length: 8000
      max_reasoning_depth: 3
      creativity_required: false
      deterministic: false
    high:
      creativity_required: true
      strategic_thinking: true

  quality_check:
    enabled: true
    fallback_on_failure: true
    validation_method: schema_compliance  # schema_compliance | llm_judge

  cost_tracking:
    enabled: true
    alert_threshold_usd: 100.0
