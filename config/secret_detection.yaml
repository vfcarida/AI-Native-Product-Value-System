# Hybrid ML + Regex Secret Detection Configuration (EVO-024)
secret_detection:
  enabled: true
  use_ml: true
  confidence_threshold: 0.7
  entropy_threshold: 4.2
  allowlist_file: config/secret_detection_allowlist.yaml
  entity_types:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - GITHUB_TOKEN
    - AWS_ACCESS_KEY
    - AWS_SECRET_ACCESS_KEY
    - SLACK_TOKEN
    - PRIVATE_KEY
    - GENERIC_API_KEY
    - PASSWORD
    - BEARER_TOKEN
    - CREDIT_CARD
