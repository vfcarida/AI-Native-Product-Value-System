# Pre-commit quality & security gates for AI-Native Product Value System (Round 15)
repos:
  - repo: local
    hooks:
      - id: secret-scan-regex
        name: Secret Detection (Fast Regex Gate)
        entry: python -m product_value_system.security.detect_secrets --regex-only
        language: python
        pass_filenames: true

      - id: ruff-check
        name: Ruff Lint Gate
        entry: ruff check src/ tests/ scripts/
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy-check
        name: Mypy Strict Type Check (src/)
        entry: mypy src/
        language: system
        pass_filenames: false
        types: [python]

      - id: config-and-doctor
        name: Strict YAML Config & System Diagnostics (pvs doctor)
        entry: python -m product_value_system.cli.main doctor --repo-root .
        language: python
        pass_filenames: false

      - id: policy-sync
        name: Cedar / Python Policy Parity Check
        entry: python scripts/validate-policy-sync.py
        language: python
        pass_filenames: false

      - id: drift-check
        name: Spec/Code Drift Detection
        entry: python scripts/pre-commit-drift-check.py
        language: python
        pass_filenames: false
